[project]
name = "l2-errata"
version = "0.1.0"
description = "A platform-agnostic log of language-learning mistakes, classified with ERRANT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "errant>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "en-core-web-sm",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
